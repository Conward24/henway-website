name: Refresh spark cards

# The idea side of the homepage fork shows "what just became possible to build".
# That claim decays, and a monthly chore is a chore that stops happening, so it
# runs here instead. Commits only when the cards actually change; Vercel picks
# the commit up and redeploys.
#
# To pause it: disable this workflow in the Actions tab. The cards stay at
# whatever was last generated rather than disappearing.

on:
  schedule:
    # 07:00 UTC on the 1st. Early enough that a bad set can be spotted and
    # reverted during the working day rather than sitting live all weekend.
    - cron: '0 7 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-sparks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The script exits non-zero and leaves the file untouched if the API is
      # down or returns a short set, so a bad month keeps last month's cards.
      - name: Ask the app for current sparks
        run: node tools/refresh-sparks.mjs

      - name: Commit if the cards changed
        run: |
          if git diff --quiet -- src/sparks.ts; then
            echo "sparks unchanged, nothing to commit"
            exit 0
          fi
          git config user.name  "henway-bot"
          git config user.email "noreply@henwayai.com"
          git add src/sparks.ts
          git commit -m "Refresh spark cards

          Regenerated from /signal. These claim to be current, so they are
          replaced monthly rather than left to rot on the homepage."
          git push
