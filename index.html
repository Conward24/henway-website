         drifted twice now: first carrying "Turn what you already know into what AI can
         build" after that line was removed for billing the reader for retrieval, then
         carrying "You don't need an idea to start" after the h1 moved on from it. The
         shared link is the first impression, so a card promising a sentence the page
         does not say is the same bait either way.

         The title tag and og:title differ on purpose. Search truncates near 60
         characters, so that one is short; a social card wraps to two lines, so that one
         gets the full hook. -->
